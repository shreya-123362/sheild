<!DOCTYPE html>
<html>
<head>
    <title>SHEILD - Compare Cases</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Compare Two Cases</h1>
    <p><a href="{{ url_for('history') }}">← Back to history</a></p>

    {% if cases|length < 2 %}
        <p>You need at least 2 analyzed cases to compare. Analyze more emails first.</p>
    {% else %}
        <form method="GET" action="{{ url_for('compare') }}">
            <label>Case A:</label>
            <select name="case_a" required>
                {% for case in cases %}
                    <option value="{{ case.id }}">{{ case.subject }} ({{ case.level }})</option>
                {% endfor %}
            </select>
            <br><br>
            <label>Case B:</label>
            <select name="case_b" required>
                {% for case in cases %}
                    <option value="{{ case.id }}">{{ case.subject }} ({{ case.level }})</option>
                {% endfor %}
            </select>
            <br><br>
            <button type="submit">Compare</button>
        </form>
    {% endif %}
</body>
</html>
